[project]
name = "ventormenta"
version = "0.1.0"
description = "Reconstrucción y predicción D+1 de la generación eólica programada en Galicia, en Databricks."
license = "GPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    # El entorno serverless 6 de Databricks trae la 2.32.5: la cota inferior no obliga a
    # reinstalarla en cada ejecución del job.
    "requests>=2.32",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
# Lo que necesita el vigilante de GitHub Actions, que corre desde el repositorio y no desde
# el wheel. El paquete no depende del SDK: el job de Databricks lo tiene en su entorno.
watchdog = [
    # Versión comprobada con la opción scopes, que exige el secreto del vigilante.
    "databricks-sdk>=0.122",
]
dev = [
    # Los tipos del SDK, para que mypy compruebe el punto de entrada del vigilante.
    { include-group = "watchdog" },
    # Versión exacta en las herramientas cuyo veredicto puede cambiar de una versión a otra.
    "mypy==2.4.0",
    "prek>=0.5.5",
    "pytest>=9.1.1",
    "responses>=0.25",
    "ruff==0.17.0",
    "types-requests>=2.32",
    "zizmor==1.30.1",
]

[tool.uv]
required-version = ">=0.13.1"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (errores)
    "W",   # pycodestyle (avisos)
    "F",   # pyflakes
    "I",   # orden de imports
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # reglas propias de ruff
    "PT",  # flake8-pytest-style
    "DTZ", # fechas sin zona horaria: la corrección temporal depende de que no existan
    "S",   # flake8-bandit: p. ej., peticiones HTTP sin timeout a las fuentes
    "ANN", # anotaciones de tipos
]

[tool.ruff.lint.per-file-ignores]
# En los tests, assert es la herramienta (S101) y lanzar git es legítimo (S603, S607).
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
strict = true
# Los notebooks quedan fuera: dependen de globales de Databricks como dbutils.
files = ["src", "tests"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
